<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHM Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-color: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --joy: #4ade80;
            --sadness: #60a5fa;
            --anger: #f87171;
            --fear: #c084fc;
            --surprise: #fbbf24;
            --love: #f472b6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        /* Navigasi */
        .navbar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .navbar a {
            text-decoration: none;
            color: #94a3b8;
            font-size: 1.2em;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .navbar a:hover, .navbar a.active {
            background-color: var(--panel-color);
            color: var(--accent-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Grid Layout Dashboard */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .panel {
            background-color: var(--panel-color);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        .panel h2 {
            margin-top: 0;
            color: var(--accent-color);
            font-size: 1.3em;
        }

        .big-number {
            font-size: 3.5em;
            font-weight: bold;
            color: var(--text-color);
            margin: 10px 0;
        }

        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="/">Live Analisis</a>
        <a href="/dashboard" class="active">Dashboard Analisis</a>
    </div>

    <div class="dashboard-grid">
        <div class="panel">
            <h2>Total Ulasan Dianalisis</h2>
            <div class="big-number" id="total-reviews">{{ total_reviews }}</div>
            <p style="color: #94a3b8;">Berdasarkan ekstraksi data Letterboxd</p>
        </div>

        <div class="panel" style="grid-row: span 2;">
            <h2>Distribusi Spektrum Emosi Audiens</h2>
            <div class="chart-container" style="height: 400px;">
                <canvas id="barChart"></canvas>
            </div>
        </div>

        <div class="panel">
            <h2>Komposisi Dominan</h2>
            <div class="chart-container">
                <canvas id="doughnutChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Mengambil data dari Python (app.py)
        const rawData = {{ emotion_counts | tojson }};
        
        const labels = Object.keys(rawData);
        const dataValues = Object.values(rawData);

        // Mapping Warna sesuai CSS
        const colorMap = {
            'Joy': '#4ade80', 'Sadness': '#60a5fa', 
            'Anger': '#f87171', 'Fear': '#c084fc', 
            'Surprise': '#fbbf24', 'Love': '#f472b6'
        };
        const backgroundColors = labels.map(label => colorMap[label] || '#38bdf8');

        // Render Bar Chart
        const ctxBar = document.getElementById('barChart').getContext('2d');
        new Chart(ctxBar, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Jumlah Ulasan',
                    data: dataValues,
                    backgroundColor: backgroundColors,
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                    x: { grid: { display: false }, ticks: { color: '#f8fafc', font: { weight: 'bold' } } }
                }
            }
        });

        // Render Doughnut Chart
        const ctxDoughnut = document.getElementById('doughnutChart').getContext('2d');
        new Chart(ctxDoughnut, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{
                    data: dataValues,
                    backgroundColor: backgroundColors,
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom', labels: { color: '#f8fafc' } }
                }
            }
        });
    </script>
</body>
</html>
